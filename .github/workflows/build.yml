name: Construire l'appli Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Construire l'APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TRACE_PHOTO.apk

      - name: Mettre l'APK dans les Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: TRACE PHOTO v${{ github.run_number }}
          files: TRACE_PHOTO.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TRACE_PHOTO
          path: TRACE_PHOTO.apk

